[project]
name = "mini-harness"
version = "0.3.0"
description = "A minimal, runnable, testable agent harness with real LLM providers and an interactive CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28.0",
]

[project.scripts]
mini-bot = "mini_harness.cli.main:cli"
mini-harness = "mini_harness.cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["mini_harness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
